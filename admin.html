<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RON COLLECTION — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0 auto;background:#f4ede0;color:#17130e;font:16px/1.5 system-ui,sans-serif;padding:16px 16px 90px;max-width:720px}
h1{font:600 20px Georgia,serif;letter-spacing:.12em;margin:6px 0 14px}h2{font:600 18px Georgia,serif;margin:28px 0 10px}
input,select,textarea,button{font:inherit;width:100%;padding:12px;border:1px solid #d8cbb0;border-radius:10px;background:#fff;margin:4px 0 10px}
label{font-size:13px;color:#6d665a}button{background:#17130e;color:#fff;border:0;font-weight:600;cursor:pointer}button.g{background:#a8802f}button.r{background:#b3261e}button.l{background:#fff;color:#17130e;border:1px solid #d8cbb0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chk{display:flex;gap:10px;align-items:center}.chk input{width:auto;margin:0}
.media{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.m{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;background:#000;border:2px solid transparent}.m.main{border-color:#a8802f}.m img,.m video{width:100%;height:100%;object-fit:cover}
.m b{position:absolute;top:3px;right:3px;background:#fff;color:#000;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;cursor:pointer}.m small{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);color:#fff;font-size:10px;text-align:center}
.it{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #d8cbb0;border-radius:12px;padding:10px;margin-bottom:8px}.it img{width:54px;height:54px;object-fit:cover;border-radius:8px;background:#eadfca}.it div{flex:1;min-width:0}.it button{width:auto;padding:8px 12px;margin:0}
.save{position:fixed;left:0;right:0;bottom:0;background:#f4ede0;border-top:1px solid #d8cbb0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}.save button{margin:0}
#msg{position:fixed;left:16px;right:16px;bottom:80px;background:#17130e;color:#fff;padding:12px;border-radius:10px;display:none;text-align:center;z-index:5}
</style></head><body>
<h1>RON COLLECTION · ADMIN</h1>
<div id="login"><label>Admin password</label><input id="pw" type="password" autocomplete="current-password"><button onclick="enter(pw.value)">Login</button><p id="lerr" style="color:#b3261e"></p></div>
<div id="app" hidden>
<h2 id="ft" style="margin-top:0">Add a watch</h2>
<div class="row"><div><label>Product ID *</label><input id="id"></div><div><label>Category *</label><select id="cat"><option>Men's Watches</option><option>Women's Watches</option><option>Digital Watches</option><option>Luxury Watches</option></select></div></div>
<label>Watch name *</label><input id="name">
<div class="row"><div><label>Price ₹ *</label><input id="price" type="number" inputmode="numeric"></div><div><label>Original price ₹ (optional)</label><input id="orig" type="number" inputmode="numeric"></div></div>
<label>Discount text (optional — leave blank to auto-fill from the two prices)</label><input id="disc">
<label class="chk"><input id="isnew" type="checkbox"> Show in New Arrivals</label><br>
<label>Photos &amp; video — tap a photo to make it the main one</label>
<div class="media" id="media"></div>
<input id="file" type="file" accept="image/*,video/*" multiple onchange="up(this.files)">
<label>Description</label><textarea id="desc" rows="4"></textarea>
<label>Variants (optional, separate with commas, e.g. Black, Silver)</label><input id="vars">
<label>Specifications (optional, one per line, like  Strap: Leather)</label><textarea id="specs" rows="3"></textarea>
<h2>Your watches</h2><div id="list"></div></div>
<div class="save" id="bar" hidden><button class="l" style="width:40%" onclick="reset()">Clear</button><button class="g" onclick="save()">Save watch</button></div>
<div id="msg"></div>
<script>
const $=s=>document.querySelector(s);let PW=sessionStorage.pw||"",items=[],cur={images:[],video:"",poster:""};
const SEED={id:"RC-001",name:"Gold Skeleton Watch",price:2500,originalPrice:4000,discount:"₹1,500 OFF",category:"Men's Watches",isNew:true,image:"images/rc-001.jpg",images:[],video:"videos/rc-001.mp4",poster:"videos/rc-001-poster.jpg",description:"",variants:[],specs:{},rating:null,reviewCount:0,reviews:[]};
const say=t=>{const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(say.t);say.t=setTimeout(()=>m.style.display="none",3500)};
const api=(u,o={})=>fetch(u,{...o,headers:{...(o.headers||{}),"x-admin-password":PW}});
async function enter(p){PW=p;const r=await api("/api/check").catch(()=>({ok:false}));if(r.ok){sessionStorage.pw=PW;$("#login").hidden=true;$("#app").hidden=false;$("#bar").hidden=false;await load();reset()}else $("#lerr").textContent="Wrong password, or the admin is not set up yet"}
if(PW)enter(PW);
async function load(){const r=await fetch("/api/products",{cache:"no-store"});items=r.ok?await r.json():[];
$("#list").innerHTML=(items.length?"":`<p>No watches in the admin yet.</p><button class="g" onclick="seed()">Import my first watch (${SEED.name})</button>`)+items.map(p=>`<div class="it"><img src="${p.image||p.poster||""}" alt=""><div><b>${p.name}</b><br><small>${p.id} · ₹${p.price}</small></div><button class="l" onclick="edit('${p.id}')">Edit</button><button class="r" onclick="del('${p.id}')">Delete</button></div>`).join("")}
async function seed(){const r=await api("/api/products",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(SEED)});if(r.ok){say("Imported ✔");await load();reset()}else say("Could not import")}
function drawMedia(){$("#media").innerHTML=cur.images.map((u,i)=>`<div class="m ${i?"":"main"}" onclick="mk(${i})"><img src="${u}"><b onclick="event.stopPropagation();cur.images.splice(${i},1);drawMedia()">×</b>${i?"":"<small>MAIN</small>"}</div>`).join("")+(cur.video?`<div class="m">${cur.poster?`<img src="${cur.poster}">`:`<video src="${cur.video}" muted></video>`}<b onclick="cur.video='';cur.poster='';drawMedia()">×</b><small>VIDEO</small></div>`:"")}
function mk(i){cur.images.unshift(...cur.images.splice(i,1));drawMedia()}
function shrink(f){return new Promise(res=>{if(!f.type.startsWith("image/")||f.type==="image/gif")return res(f);const i=new Image();i.onload=()=>{const s=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(new File([b],"p.jpg",{type:"image/jpeg"})),"image/jpeg",.84)};i.onerror=()=>res(f);i.src=URL.createObjectURL(f)})}
function frame(f){return new Promise(res=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=URL.createObjectURL(f);v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};v.onseeked=()=>{const s=Math.min(1,540/v.videoWidth),c=document.createElement("canvas");c.width=v.videoWidth*s;c.height=v.videoHeight*s;c.getContext("2d").drawImage(v,0,0,c.width,c.height);c.toBlob(b=>res(b?new File([b],"poster.jpg",{type:"image/jpeg"}):null),"image/jpeg",.8)};v.onerror=()=>res(null);setTimeout(()=>res(null),8000)})}
async function send(f){const fd=new FormData();fd.append("file",f);const r=await api("/api/upload",{method:"POST",body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
async function up(files){for(const f0 of files){try{say("Uploading "+f0.name+"…");const isV=f0.type.startsWith("video/");const f=isV?f0:await shrink(f0);const d=await send(f);if(isV){cur.video=d.url;const pf=await frame(f0);if(pf){try{cur.poster=(await send(pf)).url}catch(e){}}}else cur.images.push(d.url);drawMedia()}catch(e){say("Upload failed: "+e.message)}}$("#file").value="";say("Upload done — now tap Save watch")}
function reset(){cur={images:[],video:"",poster:""};["id","name","price","orig","disc","desc","vars","specs"].forEach(k=>$("#"+k).value="");$("#isnew").checked=false;$("#ft").textContent="Add a watch";const n=items.map(p=>parseInt((p.id.match(/(\d+)$/)||[])[1])||0);$("#id").value="RC-"+String(Math.max(0,...n)+1).padStart(3,"0");drawMedia()}
function edit(id){const p=items.find(x=>x.id===id);if(!p)return;$("#ft").textContent="Edit watch";$("#id").value=p.id;$("#cat").value=p.category;$("#name").value=p.name;$("#price").value=p.price;$("#orig").value=p.originalPrice||"";$("#disc").value=p.discount||"";$("#isnew").checked=!!p.isNew;$("#desc").value=p.description||"";$("#vars").value=(p.variants||[]).join(", ");$("#specs").value=Object.entries(p.specs||{}).map(([k,v])=>k+": "+v).join("\n");cur={images:[p.image,...(p.images||[])].filter(Boolean),video:p.video||"",poster:p.poster||""};drawMedia();scrollTo({top:0,behavior:"smooth"})}
async function save(){const id=$("#id").value.trim(),name=$("#name").value.trim(),price=Number($("#price").value),orig=$("#orig").value?Number($("#orig").value):null;if(!id||!name||!price)return say("Fill ID, name and price");
const old=items.find(x=>x.id===id)||{},specs={};$("#specs").value.split("\n").forEach(l=>{const i=l.indexOf(":");if(i>0)specs[l.slice(0,i).trim()]=l.slice(i+1).trim()});
let disc=$("#disc").value.trim();if(!disc&&orig&&orig>price)disc="₹"+(orig-price).toLocaleString("en-IN")+" OFF";
const d={...old,id,name,price,originalPrice:orig,discount:disc,category:$("#cat").value,isNew:$("#isnew").checked,image:cur.images[0]||"",images:cur.images.slice(1),video:cur.video,poster:cur.poster,description:$("#desc").value.trim(),variants:$("#vars").value.split(",").map(s=>s.trim()).filter(Boolean),specs};
const r=await api("/api/products",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)});if(r.ok){say("Saved ✔");await load();reset()}else say("Could not save")}
async function del(id){if(!confirm("Delete "+id+"?"))return;await api("/api/products?id="+encodeURIComponent(id),{method:"DELETE"});say("Deleted");load()}
</script></body></html>
