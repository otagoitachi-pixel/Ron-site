<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="content-language" content="en-EN" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Virtual Watch Try-On | RON COLLECTION</title>
    
    <!-- INCLUDE WEBARROCKSHAND SCRIPT -->
    <script src="dist/WebARRocksHand.js"></script>
    
    <!-- THREE.JS - REPLACE IT BY three.min.js FOR PROD -->
    <script src="libs/three/v136/build/three.min.js"></script>

    <!-- THREE.JS EXTENSIONS -->
    <script src="libs/three/v136/examples/js/loaders/GLTFLoader.js"></script>
    <script src="libs/three/v136/examples/js/loaders/RGBELoader.js"></script>

    <!-- WEBARROCKSHAND THREEJS VTO HELPER -->
    <script src="helpers/HandTrackerThreeHelper.js"></script>

    <!-- change camera helper -->
    <script src="helpers/ChangeCameraHelper.js"></script>
    

    <!-- WEBARROCKSHAND POINTS STABILIZER -->
    <script src="helpers/landmarksStabilizers/OneEuroLMStabilizer.js"></script>

     <!-- POSEFLIP FILTER -->
    <script src="helpers/PoseFlipFilter.js"></script>
    
    <!-- INCLUDE MAIN DEMO SCRIPT -->
    <script src="./main.js"></script>

    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet" />


    <style type='text/css'>
      body {
        background-color: #333;
        margin: 0;
        overflow: hidden;
        font-family: 'Roboto', sans-serif;
      }
      canvas {
        position: fixed;
        top: 0;
        /*left: 0;
        width: 100vw*/
        height: 100vh;
      }
      #handTrackerCanvas {
        z-index: 1;
      }
      #VTOCanvas {
        z-index: 2;
      }
      canvas {
        /* mirror the canvas - useful if camera is in selfie mode only: */
        left: 50%;
        transform: translate(-50%, 0%) rotateY(180deg);
      }


      #ronHeader {
        position: fixed; top: 0; left: 0; right: 0; z-index: 5;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 12px;
        color: #f7f0e3; background: linear-gradient(rgba(15,13,10,.82), rgba(15,13,10,0));
        box-sizing: border-box; pointer-events: none;
      }
      #ronHeader a { pointer-events: auto; color: #17130e; background: #e0bd76;
        border-radius: 999px; padding: 9px 13px; text-decoration: none; font-size: 13px; font-weight: 700; }
      #ronHeader .brand { font-size: 13px; font-weight: 700; letter-spacing: .12em; }
      #ronProduct { position: fixed; z-index: 5; left: 12px; right: 12px; bottom: 54px;
        text-align: center; color: white; text-shadow: 0 1px 5px #000; font-size: 12px; pointer-events:none; }
      .modal {
        display: flex; 
        flex-direction: column;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        transition-duration: 500ms;
        position: fixed;
      }

      #loading {
        background: #1c3e83;
        color: white;
        opacity: 1;
        z-index: 10;
      }
      #loading > div {
        margin: auto;
        font-size: 32pt;
      }

      #instructions {
        z-index: 9;
        background-color: rgba(0,0,0,0.5);
        color: white;
        font-size: 22px;
      }
      #instructions > div {
        margin: auto;
        text-align: center;
        line-height: 1.5em;
      }
      .instructionsOK {
        border: 1px solid white;
        background: transparent;
        color: white;
        font-size: 22px;
        padding: 22px;
        margin: 1em;
        cursor: pointer;
        width: 200px;
      }
      .instructionsImg {
        margin-top: 12px;
        max-height: 50vh;
        max-width: 50vw;
      }

      #tryonError {
        display: none; position: fixed; inset: 0; z-index: 20; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 28px; text-align: center;
        background: rgba(15,13,10,.94); color: #f7f0e3; font-size: 17px; line-height: 1.5;
      }
      #tryonError p { max-width: 420px; margin: 0; }
      #tryonError button, #tryonError a { border: 0; border-radius: 999px; padding: 13px 22px; font-size: 15px; font-weight: 700;
        background: #e0bd76; color: #17130e; text-decoration: none; cursor: pointer; }

      #changeCamera {
        display: none;
        position: fixed;
        z-index: 4;
        bottom: 6px;
        left: 6px;
        background-color: rgba(0,0,0,0.5);
        color: white;
        font-variant: small-caps;
        border: none;
        padding: 12px;
      }

    </style>
  </head>
  <body>
    <header id="ronHeader">
      <span class="brand">RON COLLECTION</span>
      <a href="/#watches">← Back to watches</a>
    </header>
    <div id="ronProduct">Virtual try-on preview · Sample Casio 3D model · Appearance may differ from the selected product</div>

    <div id='tryonError'>
      <p></p>
      <button onclick="location.reload()">Try again</button>
      <a href="/#watches">Back to watches</a>
    </div>

    <!-- loading modal: -->
    <div id='loading' class='modal'>
      <div>
        LOADING WATCH TRY-ON...
      </div>
    </div>

    <!-- instructions: -->
    <div id='instructions' class='modal'>
      <div>
        Place your hand like that:<br/>
        <img src='assets/VTOWristGuidline500px.png' class="instructionsImg" /><br/>
        <button class='instructionsOK' onclick="hide_instructions()">OK</button>
      </div>
    </div>

    <div id='canvases'>
      <!-- Canvas displayed above, with the THREE.js scene -->
      <canvas id='VTOCanvas'></canvas>

      <!-- Canvas used by the hand tracker and displaying the video -->
      <canvas id='handTrackerCanvas'></canvas>
    </div>

    <button onclick='change_camera()' id='changeCamera'>Change camera</button>
  <script>
(function(){
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  const id = params.get('watch');
  const label = document.getElementById('ronProduct');
  if (name) {
    label.textContent = 'Trying on: ' + name + ' · Sample Casio 3D model — fit and appearance may differ';
  } else if (id) {
    label.textContent = 'Product ' + id + ' · Sample Casio 3D model — fit and appearance may differ';
  }
})();
</script>
</body>
</html>
