<style>
:root{--bg:#f4ede0;--paper:#fbf7ee;--ink:#17130e;--gold:#a8802f;--line:#d8cbb0;--arch:#eadfca;--wa:#1f7a47;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:calc(90px + env(safe-area-inset-top,0px))}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.serif{font-family:Fraunces,Georgia,serif;font-weight:400;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(244,237,224,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:88px;gap:10px}
.logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;line-height:1;white-space:nowrap}
.logo img{height:44px;width:auto;display:block;flex:none}
.lt{display:flex;align-items:center;gap:.4em;font-family:Fraunces,serif;font-size:12px;letter-spacing:.26em;line-height:1;margin-right:-.26em}
.lt b{font-weight:600;color:var(--ink)}
.lt small{font:400 1em Fraunces,serif;color:var(--gold);letter-spacing:inherit}
nav{display:none;gap:24px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
nav a{position:relative;padding:6px 0}
nav a:after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:.3s}
nav a:hover:after{width:100%}
.acts{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ibtn{background:none;border:0;width:48px;height:48px;display:grid;place-items:center;font-size:20px;transition:.25s;border-radius:50%}
.ibtn:hover{color:var(--gold)}
#bg{font-size:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 30px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:.3s;border-radius:99px}
.btn:hover{background:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{color:#fff}
.btn.sm{padding:12px 18px;font-size:11px;width:100%}
#menu{display:none;border-top:1px solid var(--line);padding:6px 22px 18px;background:var(--bg)}
#menu a{display:block;padding:14px 0;border-bottom:1px solid var(--line);font:italic 400 24px Fraunces,serif}
#menu.open{display:block}
#sbar{display:none;border-top:1px solid var(--line);padding:12px 22px}
#sbar.open{display:block}
#q{width:100%;padding:14px 20px;border:1px solid var(--line);background:var(--paper);font:inherit;border-radius:99px}
section{padding:36px 0 28px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:26px}
.sh small{display:block;color:var(--gold);font-weight:700;letter-spacing:.3em;font-size:11px;margin-bottom:8px}
.sh h1,.sh h2{font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-.02em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 18px;font-size:12px;font-weight:600;letter-spacing:.08em;border-radius:99px;transition:.25s}
.chip:hover{background:var(--arch)}
.chip.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:40px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.3s}
.card:hover{box-shadow:0 16px 34px -16px rgba(60,40,10,.4);transform:translateY(-3px)}
.ci{aspect-ratio:1;background:#f0e8d8;overflow:hidden;cursor:pointer;border:0;padding:0;position:relative}
.ci img{width:100%;height:100%;object-fit:cover;transition:.6s}
.card:hover .ci img{transform:scale(1.05)}
.tag{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:10px;padding:4px 9px;letter-spacing:.12em;font-weight:700;border-radius:6px}
.tag.off{left:auto;right:10px;background:var(--gold)}
.vid{position:absolute;bottom:10px;left:10px;background:rgba(23,19,14,.78);color:#fff;font-size:10px;padding:4px 9px;border-radius:6px;font-weight:600}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;text-align:left}
.cat{font-size:10px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.cb h3{font:600 15px/1.35 Manrope,sans-serif;cursor:pointer}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:19px;font-weight:700}
.price s{color:#8a8274;font-size:13px}
.price em{font-style:normal;color:var(--wa);font-size:12px;font-weight:600}
.stars{font-size:13px;color:var(--gold)}
.stars span{color:#6d665a}
.cb .btn{margin-top:auto}
.card .btn.sm{margin-top:8px;padding:13px 10px}
.empty{text-align:center;padding:72px 22px;border:1px solid var(--line);background:var(--paper);border-radius:999px 999px 12px 12px;color:#5d564a}
.empty h3{color:var(--ink);font-size:30px;margin-bottom:8px}
#about p{max-width:640px;color:#5d564a;white-space:pre-line;font-size:18px}
footer{background:var(--ink);color:#cfc3a8;padding:60px 0 30px;margin-top:50px}
.fbrand{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:36px;margin-bottom:34px;border-bottom:1px solid #3a3226}
.fbrand img{height:70px;width:auto;margin-bottom:18px}
.fn{display:flex;align-items:center;gap:14px;width:100%;max-width:440px}
.fn span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.fn span:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.fn b{font:500 clamp(18px,5.4vw,26px) Fraunces,serif;letter-spacing:.22em;color:#f4ede0;white-space:nowrap;margin-right:-.22em}
.fg{display:grid;gap:30px;text-align:center}
.fg h4{margin:0 0 12px;font:700 11px Manrope,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.fg a,.fg p{display:block;margin:0 0 8px;font-size:14px;color:#cfc3a8}
.fg a:hover{color:#fff}
.copy{text-align:center;margin-top:34px;padding-top:20px;border-top:1px solid #3a3226;font-size:12px;color:#8f846c}
dialog{border:0;padding:0;width:min(980px,100vw);max-width:100vw;max-height:100dvh;background:var(--bg);margin:auto;overflow:auto}
dialog::backdrop{background:rgba(23,19,14,.6)}
.dx{position:sticky;top:10px;margin:10px 10px -52px auto;z-index:3;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:16px}
.dg{display:grid}
.gal{background:#f0e8d8}
.stage{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:4/5;max-height:72dvh;width:100%;scrollbar-width:none;background:#f0e8d8}
.stage::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden;background:#f0e8d8}
.slide>img,.slide video{width:100%;height:100%;display:block;position:relative}
.slide>img{object-fit:cover}
.slide.v{background:#17130e}
.slide.v>img.bg{position:absolute;inset:0;object-fit:cover;filter:blur(22px) brightness(.55);transform:scale(1.25)}
.slide video{object-fit:contain;background:transparent}
.th{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:var(--bg)}
.th button{border:2px solid transparent;padding:0;width:58px;height:58px;flex:none;background:#fff;border-radius:10px;overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover}
.th button.on{border-color:var(--gold)}
.th i{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.4);color:#fff;font-style:normal;font-size:16px}
.di{padding:22px 20px 24px;display:flex;flex-direction:column;gap:12px}
.di h2{font:600 24px/1.25 Manrope,sans-serif;letter-spacing:-.01em}
.di .price b{font-size:26px}
.pill{background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.06em;font-style:normal}
.di select{padding:12px 16px;border:1px solid var(--line);background:var(--paper);font:inherit;width:100%;border-radius:99px}
.spec{width:100%;border-collapse:collapse;font-size:14px}
.spec td{padding:9px 0;border-bottom:1px solid var(--line)}
.spec td:first-child{color:#6d665a;width:42%}
.rv{border-top:1px solid var(--line);padding:13px 0;font-size:14px}
.rv small{color:#6d665a}
.ok{color:var(--wa);font-size:12px}
@media(min-width:900px){
.logo img{height:54px}.lt{font-size:15px}
nav{display:flex}.burger{display:none}
.grid{grid-template-columns:repeat(3,1fr);gap:24px}
.fg{grid-template-columns:1fr 1fr;max-width:620px;margin:0 auto}
.dg{grid-template-columns:1fr 1fr;align-items:start}.dx{margin-bottom:-52px}
dialog{max-height:90dvh}
.bar{height:100px}
}
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Virtual watch try-on */
.tryon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:10px 0 14px;padding:13px 16px;border:1px solid #a8802f;border-radius:12px;background:#17130e;color:#f7f0e3;font:700 14px/1.2 Manrope,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.tryon-btn:hover{background:#30271a}
.tryon-note{font-size:11px;color:#766c5b;margin:-7px 0 12px}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "₹" + Number(n).toLocaleString("en-IN");
const stars = r => "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r));
const state = { q: "", cat: "all" };



/* Nav */
const NAV = [["Home","#home"],["Watches","#watches","all"],["Men's","#watches","Men's Watches"],["Women's","#watches","Women's Watches"],["New Arrivals","#watches","new"]];
if (ABOUT) NAV.push(["About","#about"]);
const navHTML = NAV.map(n => `<a href="${n[1]}" ${n[2] ? `data-cat="${esc(n[2])}"` : ""}>${n[0]}</a>`).join("");
$("#nav").innerHTML = navHTML; $("#menu").innerHTML = navHTML;
document.querySelectorAll("[data-cat]").forEach(a => a.addEventListener("click", () => { state.cat = a.dataset.cat; state.q = ""; $("#q").value = ""; closeMenu(); render(); }));
function closeMenu() { $("#menu").classList.remove("open"); $("#bg").setAttribute("aria-expanded", "false"); }
$("#bg").onclick = () => { const o = $("#menu").classList.toggle("open"); $("#bg").setAttribute("aria-expanded", o); };
$("#menu").addEventListener("click", e => { if (e.target.tagName === "A") closeMenu(); });
$("#sb").onclick = () => { const o = $("#sbar").classList.toggle("open"); if (o) $("#q").focus(); };
$("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); state.cat = "all"; render(); if (state.q) location.hash = "#watches"; });

/* About / footer */
if (ABOUT) { $("#about").hidden = false; $("#abt").textContent = ABOUT; }
$("#yr").textContent = new Date().getFullYear();
const fc = [];
if (INSTAGRAM) fc.push(`<a href="${esc(INSTAGRAM)}" target="_blank" rel="noopener">Instagram</a>`);
if (CONTACT.phone) fc.push(`<a href="tel:${esc(CONTACT.phone)}">${esc(CONTACT.phone)}</a>`);
if (CONTACT.email) fc.push(`<a href="mailto:${esc(CONTACT.email)}">${esc(CONTACT.email)}</a>`);
if (CONTACT.address) fc.push(`<p>${esc(CONTACT.address)}</p>`);
$("#fc").innerHTML = fc.join("") || `<p>Contact details coming soon.</p>`;
const pol = [["Privacy Policy","privacy"],["Terms & Conditions","terms"],["Return Policy","returns"]];
$("#fp").innerHTML = pol.map(([t,k]) => `<a href="#" data-pol="${k}">${t}</a>`).join("");
$("#fp").addEventListener("click", e => {
  const k = e.target.dataset.pol; if (!k) return; e.preventDefault();
  const v = POLICIES[k], t = e.target.textContent;
  if (/^https?:\/\//.test(v)) { window.open(v, "_blank", "noopener"); return; }
  $("#dlg").innerHTML = `<button class="ibtn dx" aria-label="Close" onclick="dlg.close()">✕</button><div class="di"><h2>${t}</h2><p style="white-space:pre-line;color:var(--mute)">${v ? esc(v) : "This policy has not been published yet."}</p></div>`;
  $("#dlg").showModal();
});

/* Product cards */
function card(p) {
  const rating = p.rating != null && p.reviewCount > 0
    ? `<div class="stars" aria-label="Rated ${p.rating} out of 5">${stars(p.rating)} <span>${p.rating} (${p.reviewCount})</span></div>` : "";
  return `<article class="card">
    <button class="ci" data-open="${esc(p.id)}" aria-label="View ${esc(p.name)}">
      ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" decoding="async">` : ""}
      ${p.isNew ? `<span class="tag">NEW</span>` : ""}${p.discount ? `<span class="tag off">${esc(p.discount)}</span>` : ""}${p.video ? `<span class="vid">▶&#xFE0E; Video</span>` : ""}
    </button>
    <div class="cb">
      <div class="cat">${esc(p.category)}</div>
      <h3 data-open="${esc(p.id)}">${esc(p.name)}</h3>
      <div class="price"><b>${money(p.price)}</b>${p.originalPrice ? `<s>${money(p.originalPrice)}</s>` : ""}</div>
      ${rating}
    </div></article>`;
}
function matches(p) {
  if (state.cat === "new" && !p.isNew) return false;
  if (state.cat !== "all" && state.cat !== "new" && p.category !== state.cat) return false;
  if (!state.q) return true;
  return [p.name, p.id, p.category].some(v => String(v || "").toLowerCase().includes(state.q));
}
function render() {
  const cats = CATEGORIES.filter(c => PRODUCTS.some(p => p.category === c));
  const hasNew = PRODUCTS.some(p => p.isNew);
  const chips = [["all","All"], ...cats.map(c => [c, c]), ...(hasNew ? [["new","New Arrivals"]] : [])];
  $("#chips").innerHTML = PRODUCTS.length > 1 ? chips.map(([v,l]) => `<button class="chip ${state.cat===v?"on":""}" data-chip="${esc(v)}">${esc(l)}</button>`).join("") : "";
  const list = PRODUCTS.filter(matches);
  $("#cnt").textContent = PRODUCTS.length ? `${list.length} ${list.length === 1 ? "watch" : "watches"}` : "";
  let html = "";
  if (!PRODUCTS.length) html = `<div class="empty"><h3>Watches will appear here</h3><p>Our collection is being added. Please check back soon.</p></div>`;
  else if (!list.length) html = `<div class="empty"><h3>No watches found</h3><p>Try a different name, product ID or category.</p></div>`;
  else html = `<div class="grid">${list.map(card).join("")}</div>`;
  $("#list").innerHTML = html;
}
document.addEventListener("click", e => {
  const chip = e.target.closest("[data-chip]"); if (chip) { state.cat = chip.dataset.chip; render(); return; }
  const op = e.target.closest("[data-open]"); if (op) detail(op.dataset.open);
});

/* Product detail */
function detail(id) {
  const p = PRODUCTS.find(x => x.id === id); if (!p) return;
  const media = [...[p.image, ...(p.images || [])].filter(Boolean).map(u => ({t:"i", u})), ...(p.video ? [{t:"v", u:p.video, poster:p.poster || ""}] : [])];
  const specs = Object.entries(p.specs || {});
  const revs = p.reviews || [];
  const head = p.rating != null && p.reviewCount > 0 ? `<div class="stars">${stars(p.rating)} <span>${p.rating} (${p.reviewCount})</span></div>` : "";
  const priceHTML = `<div class="price"><b>${money(p.price)}</b>${p.originalPrice ? `<s>${money(p.originalPrice)}</s>` : ""}${p.discount ? `<i class="pill">${esc(p.discount)}</i>` : ""}</div>`;
  const slides = media.map(m => m.t === "v"
    ? `<div class="slide v">${m.poster ? `<img class="bg" src="${esc(m.poster)}" alt="">` : ""}<video controls playsinline preload="metadata" ${m.poster ? `poster="${esc(m.poster)}"` : ""} src="${esc(m.u)}"></video></div>`
    : `<div class="slide"><img src="${esc(m.u)}" alt="${esc(p.name)}"></div>`).join("");
  $("#dlg").innerHTML = `<button class="ibtn dx" aria-label="Close" onclick="dlg.close()">✕</button>
  <div class="dg">
   <div class="gal"><div class="stage" id="stg">${slides}</div>
    ${media.length > 1 ? `<div class="th">${media.map((m,i) => `<button data-m="${i}" class="${i?"":"on"}" aria-label="${m.t==="v"?"Video":"Photo "+(i+1)}"><img src="${esc(m.t==="v" ? (m.poster||p.image||"") : m.u)}" alt="">${m.t==="v" ? "<i>▶&#xFE0E;</i>" : ""}</button>`).join("")}</div>` : ""}</div>
   <div class="di">
    <div class="cat">${esc(p.category)}</div>
    <h2>${esc(p.name)}</h2>
    ${priceHTML}
    <a class="tryon-btn" href="/tryon/?watch=${encodeURIComponent(p.id)}&amp;name=${encodeURIComponent(p.name)}">⌚ Try It On — Open Camera</a>
    <p class="tryon-note">Uses a sample 3D watch model. The preview may not exactly match this product.</p>
    <div style="color:#6d665a;font-size:13px">Product ID: ${esc(p.id)}</div>
    ${head}
    ${p.variants && p.variants.length ? `<label style="font-size:13px">Variant<select id="vs">${p.variants.map(v => `<option>${esc(v)}</option>`).join("")}</select></label>` : ""}
    ${p.description ? `<p style="margin:0;color:#5d564a;white-space:pre-line">${esc(p.description)}</p>` : ""}
    ${specs.length ? `<table class="spec">${specs.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>` : ""}
    <h3 style="font:600 17px Manrope,sans-serif;margin-top:8px">Customer Reviews</h3>
    ${revs.length ? revs.map(r => `<div class="rv"><b>${esc(r.name)}</b> <span class="stars">${stars(r.rating)}</span> ${r.verified ? `<span class="ok">✔ Verified purchase</span>` : ""}<br><small>${esc(r.date || "")}</small><p style="margin:4px 0 0">${esc(r.text)}</p></div>`).join("") : `<p style="color:#6d665a;margin:0">No customer reviews yet.</p>`}
   </div></div>`;
  const stg = $("#stg"), mark = i => document.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("on", +b.dataset.m === i));
  stg.addEventListener("scroll", () => { const i = Math.round(stg.scrollLeft / stg.clientWidth); mark(i); stg.querySelectorAll("video").forEach(v => { if (media[i] && media[i].t !== "v") v.pause(); }); }, { passive: true });
  $("#dlg").showModal(); $("#dlg").scrollTop = 0;
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => stg.scrollTo({ left: +b.dataset.m * stg.clientWidth, behavior: "smooth" }));
}
const dlg = $("#dlg");
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

render();
/* If the admin panel is set up, watches saved there replace the list above */
fetch("/api/products",{cache:"no-store"}).then(r=>r.ok?r.json():[]).then(d=>{if(Array.isArray(d)&&d.length){PRODUCTS=d;render()}}).catch(()=>{});
</script>
</body>
</html>
